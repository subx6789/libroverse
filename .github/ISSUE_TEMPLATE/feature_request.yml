name: 💡 Feature Request
description: Suggest an idea or enhancement for LibroVerse
title: "[FEAT]: "
labels: ["enhancement", "feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make LibroVerse even better? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or limitation is.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: Add support for...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
      placeholder: An alternative approach could be...
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Target Feature Area
      options:
        - Reader Experience & In-Browser PDF
        - AI Companion & Analysis
        - Community Discussions & Social Graph
        - Admin Governance & Business Analytics
        - Backend Performance & In-Memory Pipeline
        - UI/UX & Design System
        - Other
    validations:
      required: true
