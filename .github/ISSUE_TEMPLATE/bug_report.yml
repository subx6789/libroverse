name: 🐛 Bug Report
description: File a bug report to help us improve LibroVerse
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue in LibroVerse! Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Go to '/library'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected outcome...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Component Area
      options:
        - Digital Library & PDF Reader
        - AI Literary Companion
        - Community Discussion Feed
        - Admin Dashboard & Governance
        - Authentication & User Profile
        - Media & In-Memory Streaming
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Details
      description: Browser, OS, Node/npm version (if applicable).
      placeholder: Chrome 120, macOS, Node v20.x
    validations:
      required: false
